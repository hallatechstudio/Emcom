name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emcom
          POSTGRES_PASSWORD: emcom_dev_password
          POSTGRES_DB: emcom_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U emcom" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Start S3-compatible storage (SeaweedFS)
        run: |
          docker run -d --name s3 -p 9000:8333 \
            -v ${{ github.workspace }}/infra/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs:3.80 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json \
            -volume.max=100 -master.volumeSizeLimitMB=64 -master.volumePreallocate=false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20.19.5, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @emcom/shared-types build && pnpm --filter @emcom/api-client build
      - name: Prisma generate
        run: pnpm --filter @emcom/api prisma:generate
      - name: Lint & typecheck
        run: |
          pnpm --filter @emcom/api lint
          pnpm --filter @emcom/api typecheck
          pnpm --filter @emcom/web typecheck
          pnpm --filter @emcom/mobile typecheck
      - name: Wait for S3
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000 && break; sleep 2; done
      - name: Tests
        run: |
          pnpm --filter @emcom/shared-types test
          pnpm --filter @emcom/api-client test
          pnpm --filter @emcom/api test
          pnpm --filter @emcom/web test
          pnpm --filter @emcom/mobile test
      - name: Builds
        run: |
          pnpm --filter @emcom/api build
          pnpm --filter @emcom/web build
          cd apps/mobile && npx expo export --platform android --output-dir /tmp/expo-export
      - name: OpenAPI spec is up to date
        run: pnpm openapi && git diff --exit-code docs/openapi.json

  docker:
    needs: checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build & push API/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
            NEXT_PUBLIC_MEDIA_ORIGIN=${{ vars.PUBLIC_MEDIA_ORIGIN }}
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
      # Deployment itself is intentionally manual/approved: see docs/deployment.md.
